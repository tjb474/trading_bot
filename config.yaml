# --- File Paths ---
paths:
  data: "data/spy_ohlcv_20190102_20250710.dbn"  # Main data file for training/backtesting

# --- Logging Configuration ---
logging:
  level: "DEBUG"  # Can be DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# --- Trading Parameters ---
trading:
  initial_cash: 100000.0
  commission_spread_points: 0.1  # Realistic retail commission
  stake_size: 10
  train_test_split_ratio: 0.8
  
  # Date range for backtesting (optional - if not set, uses full dataset)
  backtest_start_date: "2025-01-01"  # YYYY-MM-DD format
  backtest_end_date: "2025-06-30"    # YYYY-MM-DD format

# --- Active Strategy ---
active_strategy: "ml_open_range_breakout"

# --- Strategy Configurations ---
strategies:
  # Moving Average Crossover with ML
  ml_moving_average_crossover:
    # Technical Parameters
    short_window: 40
    long_window: 100
    
    # Feature Engineering
    features:
      volatility_window: 20
      rsi_window: 14
      feature_list: ['returns', 'volatility', 'rsi']
    
    # Model Configuration  
    model:
      use_ml_filter: true
      path: "data/ml_moving_average_model.joblib"
      probability_threshold: 0.70


  # Opening Range Breakout
  ml_open_range_breakout:
    # Time Parameters
    range:
      start: "09:30:00"
      end: "09:50:00"
    
    # Risk Management (relative to OR, from the entry price)
    risk:
      take_profit_multiplier: 1.0
      stop_loss_multiplier: 1.1
    
    # Feature Engineering
    features:
      volatility_window: 20
      rsi_window: 14
      atr_window: 14
      lookback_days: 20
      feature_list: ['returns', 'volatility', 'rsi', 'is_nr4', 'is_nr7', 
                     'breakout_direction', 'or_size_absolute', 'or_size_normalized',
                     'or_volume', 'or_volume_vs_average', 'or_midpoint_location',
                     'day_of_week']

    # Model Configuration
    model:
      use_ml_filter: false
      path: "data/ml_orb_model.joblib"
      probability_threshold: 0.55